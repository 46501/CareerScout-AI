name: CareerScout AI CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Typecheck
      run: npm run typecheck
      
    - name: Lint
      run: npm run lint
      
    - name: Unit & Integration Tests
      run: npm run test
      env:
        JWT_SECRET: test_secret_key
        MONGODB_URI: mongodb://localhost:27017/careerscout_test
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        
    - name: Build
      run: npm run build
